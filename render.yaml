# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: github-text-updater
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz
    buildCommand: npm ci
    startCommand: npm start
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Encrypts the session cookie that holds the GitHub token. Generated by Render.
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      # Optional tuning
      - key: MAX_SPEC_BYTES
        value: "4194304"
      - key: MAX_FILES
        value: "200"
      - key: MAX_FILE_BYTES
        value: "1048576"
